services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mybooks-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports: ["1433:1433"]
    volumes:
      - sql_data:/var/opt/mssql

  auth:
    build:
      context: .
      dockerfile: MyBooks.AuthService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Server=db;Database=AuthDb;User ID=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
      Jwt__Issuer: "MyBooks"
      Jwt__Audience: "MyBooksUsers"
      Jwt__Key: "bSsNjwGplw+qA/0UcpLcQDR5rCj1HwOf7maw6zrf81Y="
    depends_on: [db]
    ports: ["5001:8080"]

  catalog:
    build:
      context: .
      dockerfile: MyBooks.CatalogService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Server=db;Database=CatalogDb;User ID=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
    depends_on: [db]
    ports: ["5002:8080"]

  files:
    build:
      context: .
      dockerfile: MyBooks.FileService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Server=db;Database=FileDb;User ID=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
    depends_on: [db]
    ports: ["5003:8080"]

  web:
    build:
      context: MyBooks.UI
      dockerfile: Dockerfile
    depends_on: [auth, catalog, files]
    ports: ["8080:80"]

volumes:
  sql_data:
