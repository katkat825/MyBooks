services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mybooks-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "69kf5ZR$4OWp!q"
      MSSQL_PID: "Developer"
      MSSQL_TCP_PORT: 1433
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/1433"]
      interval: 5s
      timeout: 5s
      retries: 15

  auth:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: MyBooks.AuthService/Dockerfile
    env_file:
      - .env
    ports:
      - "5001:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  catalog:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: MyBooks.CatalogService/Dockerfile
    env_file:
      - .env
    ports:
      - "5002:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  files:
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    build:
      context: .
      dockerfile: MyBooks.FileService/Dockerfile
    env_file:
      - .env
    ports:
      - "5003:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    
  clamav:
    image: clamav/clamav:latest
    container_name: mybooks-clamav
    restart: always
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 60s
      timeout: 10s
      retries: 5

  tenants:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: MyBooks.TenantService/Dockerfile
    env_file:
      - .env
    ports:
      - "5004:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  emails:
    build:
      context: .
      dockerfile: MyBooks.EmailService/Dockerfile
    env_file:
      - .env
    ports:
      - "5005:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  support:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: MyBooks.SupportService/Dockerfile
    env_file:
      - .env
    ports:
      - "5006:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: MyBooks.UI
      dockerfile: Dockerfile
      args:
        - BUILD_CONFIGURATION=production
    depends_on:
      - auth
      - catalog
      - files
      - tenants
      - emails
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-qa:
    build:
      context: MyBooks.UI
      dockerfile: Dockerfile
      args:
        - BUILD_CONFIGURATION=qa
    depends_on:
      - auth
      - catalog
      - files
      - tenants
      - emails
      - support
    ports:
      - "8082:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sql_data:
