services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mybooks-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/1433"]
      interval: 5s
      timeout: 5s
      retries: 15

  auth:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: MyBooks.AuthService/Dockerfile
    env_file:
      - .env
    ports:
      - "5001:8080"

  catalog:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: MyBooks.CatalogService/Dockerfile
    env_file:
      - .env
    ports:
      - "5002:8080"

  files:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: MyBooks.FileService/Dockerfile
    env_file:
      - .env
    ports:
      - "5003:8080"

  tenants:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: MyBooks.TenantService/Dockerfile
    env_file:
      - .env
    ports:
      - "5004:8080"

  emails:
    build:
      context: .
      dockerfile: MyBooks.EmailService/Dockerfile
    env_file:
      - .env
    ports:
      - "5005:8080"

  support:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: MyBooks.SupportService/Dockerfile
    env_file:
      - .env
    ports:
      - "5006:8080"

  web:
    build:
      context: MyBooks.UI
      dockerfile: Dockerfile
    depends_on:
      - auth
      - catalog
      - files
      - tenants
      - emails
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  sql_data:
