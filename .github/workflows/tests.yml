name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore MyBooks.sln

      - name: Build
        run: dotnet build MyBooks.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test MyBooks.sln --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"

      - name: Publish results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: '**/TestResults/**'

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    # The suite needs a deployed environment and four seeded accounts, so it does not run
    # on every pull request from a fork.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        working-directory: e2e
        run: npm ci

      - name: Install browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run suite
        working-directory: e2e
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
          OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          REVIEWER_EMAIL: ${{ secrets.E2E_REVIEWER_EMAIL }}
          REVIEWER_PASSWORD: ${{ secrets.E2E_REVIEWER_PASSWORD }}
        run: npm test

      - name: Publish report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
