# Local development dependencies only.
# The .NET services and the Angular UI run on the host, not in here.
#   docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mybooks-sql-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local!Dev!Pass123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sql_data_dev:/var/opt/mssql
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/1433"]
      interval: 5s
      timeout: 5s
      retries: 15

  clamav:
    image: clamav/clamav:latest
    container_name: mybooks-clamav-dev
    mem_limit: 1g
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 60s
      timeout: 10s
      retries: 5

volumes:
  sql_data_dev:
