<mat-stepper linear>
  <!-- Step 1: Required Info -->
  <mat-step [stepControl]="bookForm.controls['step1']">
    <form [formGroup]="step1">
      <h3>Step 1: Required Information</h3>
      <mat-form-field class="full-width">
        <mat-label>Title</mat-label>
        <input matInput type="text" formControlName="title" required>
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Genre</mat-label>
        <mat-select formControlName="genreId" required>
          <mat-option *ngFor="let genre of genres" [value]="genre.id">{{ genre.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Age Category</mat-label>
        <mat-select formControlName="ageCategoryId" required>
          <mat-option *ngFor="let category of ageCategories" [value]="category.id">{{ category.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-button matStepperNext>Next</button>
    </form>
  </mat-step>

  <!-- Step 2: Optional Fields -->
  <mat-step [stepControl]="bookForm.controls['step2']">
    <form [formGroup]="step2">
      <h3>Step 2: Optional Fields</h3>
      <mat-form-field class="full-width">
        <mat-label>Author</mat-label>
        <input matInput type="text" formControlName="author">
      </mat-form-field>

      <div class="inline-group">
        <mat-form-field class="full-width">
          <mat-label>Series</mat-label>
          <mat-select formControlName="seriesId">
            <mat-option *ngFor="let series of seriesList" [value]="series.id">{{ series.name }}</mat-option>
          </mat-select>
        </mat-form-field>
        <button mat-icon-button type="button" (click)="toggleNewSeries()">
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <div *ngIf="newSeries">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New Series</mat-label>
          <input matInput type="text" formControlName="seriesName" />
          <button mat-icon-button type="button" (click)="saveSeries()">
            <mat-icon>save</mat-icon>
          </button>
        </mat-form-field>
      </div>

      <mat-form-field class="full-width">
        <mat-label>Series Position</mat-label>
        <input matInput type="number" formControlName="seriesPosition">
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>ISBN</mat-label>
        <input matInput type="text" formControlName="isbn">
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput rows="3" formControlName="description"></textarea>
      </mat-form-field>

      <button mat-button matStepperPrevious>Back</button>
      <button mat-button matStepperNext>Next</button>
    </form>
  </mat-step>

  <!-- Step 3: File Upload -->
  <mat-step [stepControl]="step3">
    <h3>Step 3: Upload File</h3>
    <input type="file" (change)="onFileSelected($event)">
    <p *ngIf="selectedFile">{{ selectedFile.name }}</p>

    <button mat-button matStepperPrevious>Back</button>
    <button mat-button id="upload-file" (click)="uploadFileWithBookId()">Upload & Next</button>
    <button mat-button matStepperNext>Skip</button>
  </mat-step>

  <!-- Step 4: Finalization -->
  <mat-step>
    <h3>Step 4: Finalize</h3>
    <p>Click "Save" to complete the process.</p>

    <button mat-button matStepperPrevious>Back</button>
    <button mat-button (click)="saveBook()">Save</button>
  </mat-step>
</mat-stepper>
