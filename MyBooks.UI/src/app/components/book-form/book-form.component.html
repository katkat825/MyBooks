<div class="container mt-4">
  <mat-card class="form-container">
    <mat-card-title>{{ bookId ? 'Edit Book' : 'Add New Book' }}</mat-card-title>
    <mat-card-content>
      <form [formGroup]="bookForm" (ngSubmit)="saveBook()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput type="text" formControlName="title" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Author</mat-label>
          <input matInput type="text" formControlName="author">
        </mat-form-field>

        <div class="inline-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Series</mat-label>
            <mat-select formControlName="seriesId">
              <mat-option *ngFor="let series of series" [value]="series.id">{{ series.name }}</mat-option>
            </mat-select>
          </mat-form-field>
          <button mat-icon-button type="button" (click)="toggleNewSeries()">
            <mat-icon>add</mat-icon>
          </button>
        </div>

        <div *ngIf="newSeries">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>New Series</mat-label>
            <input matInput type="text" formControlName="seriesName">
            <button type="button" (click)="saveSeries()">Save Series</button>
           </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Series Position</mat-label>
          <input matInput type="number" formControlName="seriesPosition">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Age Category</mat-label>
          <mat-select formControlName="ageCategoryId">
            <mat-option value="">Select Appropriate Age</mat-option>
            <mat-option *ngFor="let category of ageCategories" [value]="category.id">{{ category.name }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>ISBN</mat-label>
          <input matInput type="text" formControlName="isbn">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput rows="3" formControlName="description"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Location</mat-label>
          <input matInput type="text" formControlName="location">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Genre</mat-label>
          <mat-select formControlName="genreId">
            <mat-option value="">Select Genre</mat-option>
            <mat-option *ngFor="let genre of genres" [value]="genre.id">{{ genre.name }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tags</mat-label>
          <input matInput type="text" formControlName="tagInput" placeholder="Separated by commas">
        </mat-form-field>

        <div class="button-group">
          <button mat-raised-button class="save-button" type="submit">Save</button>
          <button mat-button class="cancel-button" type="button" (click)="router.navigate(['/'])">Cancel</button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
