<div class="account-settings-container">
  <h2>Reset Password</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Email</mat-label>
      <input id="email" matInput formControlName="email" required email>
    </mat-form-field>

    <div *ngIf="errorMessage" class="error-message" role="alert">{{ errorMessage }}</div>
    <div *ngIf="message" class="success-message">{{ message }}</div>

    <button id="send-reset-link" mat-button type="submit" [disabled]="loading">
      {{ loading ? 'Sending...' : 'Send Reset Link' }}
    </button>
  </form>
</div>
