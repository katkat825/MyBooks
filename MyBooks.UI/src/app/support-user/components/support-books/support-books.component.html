<div class="support-container">

  <!-- search and filters -->
  <div class="filters">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Search Books</mat-label>
      <input matInput placeholder="Search by title..." [(ngModel)]="searchTerm" (input)="applyFilters()" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>    

    <div class="filter-action">
      <mat-checkbox [(ngModel)]="showOnlyActive" (change)="applyFilters()">
        Show only Active
      </mat-checkbox>

      <mat-checkbox [(ngModel)]="showOnlyRestricted" (change)="applyFilters()">
        Show only Restricted
      </mat-checkbox>

      <!-- tenant dropdown -->
      <mat-form-field>
        <mat-label>Filter by Tenant</mat-label>
        <mat-select [(ngModel)]="selectedTenant" (selectionChange)="applyFilters()" panelClass="dropdown-select-panel">
          <mat-option [value]="null">All Tenants</mat-option>
          <mat-option *ngFor="let tenant of tenants" [value]="tenant">
            {{ tenant }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <table mat-table [dataSource]="filteredBooks" class="mat-elevation-z2 full-width">

    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let book">{{ book.id }}</td>
    </ng-container>

    <!-- Title -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let book">{{ book.title }}</td>
    </ng-container>

    <!-- Tenant -->
    <ng-container matColumnDef="tenant">
      <th mat-header-cell *matHeaderCellDef>Tenant</th>
      <td mat-cell *matCellDef="let book">{{ book.tenantId }}</td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef>Acive</th>
      <td mat-cell *matCellDef="let book">
        <mat-icon class="{{ book.isActive ? 'support-active-icon' : 'support-inactive-icon' }}">
          {{ book.isActive ? 'check_circle' : 'cancel' }}
        </mat-icon>
      </td>
    </ng-container>

    <!-- Restricted -->
    <ng-container matColumnDef="restricted">
      <th mat-header-cell *matHeaderCellDef>Restricted</th>
      <td mat-cell *matCellDef="let book">
        <mat-slide-toggle *ngIf="book.isActive"
          [checked]="book.isRestricted"
          (change)="toggleRestricted(book)">
        </mat-slide-toggle>
      </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let book">
        <button mat-icon-button [routerLink]="['/support/book-viewer', book.fileId]" matTooltip="View File" *ngIf="book.fileId > 0">
          <mat-icon>visibility</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- header + rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
