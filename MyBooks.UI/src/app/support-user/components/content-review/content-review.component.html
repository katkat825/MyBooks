<div class="support-container">

  <!-- search and filters -->
  <div class="filters">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Search Books</mat-label>
      <input matInput placeholder="title, author, series, or genre..." [(ngModel)]="searchTerm" (input)="applyFilters()" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>    
  </div>

  <table mat-table [dataSource]="filteredBooks" class="mat-elevation-z2 full-width">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let book">{{ book.id }}</td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let book">{{ book.title }}</td>
    </ng-container>

    <ng-container matColumnDef="author">
      <th mat-header-cell *matHeaderCellDef>Author</th>
      <td mat-cell *matCellDef="let book">{{ book.author }}</td>
    </ng-container>
    
    <ng-container matColumnDef="series">
      <th mat-header-cell *matHeaderCellDef>Series</th>
      <td mat-cell *matCellDef="let book">
        {{ book.series?.name ? (book.series.name + ': #' + book.seriesPosition) : '' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="genre">
      <th mat-header-cell *matHeaderCellDef>Genre</th>
      <td mat-cell *matCellDef="let book">{{ book.genre?.name || '' }}</td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let book">
        <button mat-icon-button [routerLink]="['/support/book-viewer', book.fileId]" matTooltip="Read Book">
          <mat-icon>visibility</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- header + rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
