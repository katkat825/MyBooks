<div style="position: relative;" class="form-container">
  
  <form [formGroup]="form" (ngSubmit)="submit()" class="card">
    <h3>Create Your Account</h3>

    <mat-form-field class="full-width">
        <mat-label>First Name</mat-label>
        <input matInput type="text" formControlName="firstName" required>
    </mat-form-field>

    <mat-form-field class="full-width">
        <mat-label>Last Name</mat-label>
        <input matInput type="text" formControlName="lastName" required>
    </mat-form-field>

    <mat-form-field class="full-width">
        <mat-label>Email Address</mat-label>
        <input matInput type="email" formControlName="email" required>
         <mat-error *ngIf="form.get('email')?.hasError('email')">
            Invalid email format
        </mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('emailTaken')">
            This email address is already in use
        </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" required>
        <mat-error *ngIf="form.get('password')?.hasError('minlength')">
            Minimum of 6 characters required.
        </mat-error>
    </mat-form-field>

    <button mat-button id="create-account" type="submit" [disabled]="form.invalid">Create</button>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </form>
</div>
