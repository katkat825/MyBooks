<div class="support-container">
  <h2>Tenants</h2>

  <div class="actions">
    <button mat-raised-button color="primary" (click)="createAccount()">
      Create New Account
    </button>
  </div>

  <table mat-table [dataSource]="tenants" class="mat-elevation-z2">
    <!-- id -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let tenant"> {{ tenant.id }} </td>
    </ng-container>

    <!-- name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let tenant"> {{ tenant.name }} </td>
    </ng-container>

    <!-- billing plan -->
    <ng-container matColumnDef="billingPlan">
      <th mat-header-cell *matHeaderCellDef> Billing Plan </th>
      <td mat-cell *matCellDef="let tenant"> {{ tenant.billingPlan?.name }} </td>
    </ng-container>

    <!-- isActive -->
    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef> Active </th>
      <td mat-cell *matCellDef="let tenant">
        <mat-slide-toggle 
          class="{{ tenant.isActive ? 'support-active-icon' : 'support-inactive-icon' }}"
          [ngModel]="tenant.isActive"
          (ngModelChange)="toggleActive(tenant)">
        </mat-slide-toggle>
      </td>
    </ng-container>

    <!-- createdDate -->
    <ng-container matColumnDef="createdDate">
        <th mat-header-cell *matHeaderCellDef> Created Date </th>
        <td mat-cell *matCellDef="let tenant">{{ tenant.createdDate | date:'short' }}</td>
    </ng-container>

    <!-- actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let tenant">
        <button mat-icon-button (click)="jumpIntoAccount(tenant.id)" matTooltip="Jump into account">
          <mat-icon>login</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
