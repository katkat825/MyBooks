<div class="support-container">
  <h2>Users</h2>

  <table mat-table [dataSource]="users" class="mat-elevation-z2">
    <!-- id -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>Tenant ID</th>
      <td mat-cell *matCellDef="let user">{{ user.tenantId }}</td>
    </ng-container>

    <!-- firstName -->
    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef>First Name</th>
      <td mat-cell *matCellDef="let user">{{ user.firstName }}</td>
    </ng-container>

    <!-- lastName -->
    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef>Last Name</th>
      <td mat-cell *matCellDef="let user">{{ user.lastName }}</td>
    </ng-container>

    <!-- email -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>

    <!-- role -->
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let user">{{ user.role }}</td>
    </ng-container>

    <!-- isActive -->
    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef>Active</th>
      <td mat-cell *matCellDef="let user">
        <mat-icon class="{{ user.isActive ? 'support-active-icon' : 'support-inactive-icon' }}">
          {{ user.isActive ? 'check_circle' : 'cancel' }}
        </mat-icon>
      </td>
    </ng-container>

    <!-- actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let user">
        <button mat-icon-button 
            (click)="impersonateUser(user.id)" 
            *ngIf="user.role !== 'SuperAdmin'"
            matTooltip="Impersonate user">
          <mat-icon>login</mat-icon>
        </button>

        <button mat-icon-button 
          (click)="openGlobalReviewerDialog(user)"
          matTooltip="Manage GlobalReviewer Access">
          <mat-icon>verified_access</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
