<div class="container mt-4">
  <h2>Users</h2>

  <!-- Toggle Inactive Users -->
  <button mat-button (click)="toggleInactiveUsers()">
    <mat-icon>{{ showInactiveUsers ? 'visibility_off' : 'visibility' }}</mat-icon>
    {{ showInactiveUsers ? 'Hide Inactive Users' : 'Show Inactive Users' }}
  </button>

  <!-- Button to Show Add User Form -->
  <button mat-button (click)="toggleAddUserForm()">
    <mat-icon>{{ showAddUserForm ? 'close' : 'add' }}</mat-icon>
    {{ showAddUserForm ? 'Cancel' : 'Add User' }}
  </button>

  <!-- Add User Form inside a Card -->
    <mat-card *ngIf="showAddUserForm" class="add-user-card">
      <mat-card-title>Add New User</mat-card-title>
      <form [formGroup]="userForm" (ngSubmit)="addUser()" class="user-form">

        <mat-form-field>
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName" required />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName" required />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" required />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" required />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Role</mat-label>
          <mat-select formControlName="role" required>
            <mat-option *ngFor="let role of roles" [value]="role">{{ role }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Age Category</mat-label>
          <mat-select formControlName="ageCategoryId" required>
            <mat-option *ngFor="let category of ageCategories" [value]="category.id">
              {{ category.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <div class="button-group">
          <button mat-button type="submit" [disabled]="userForm.invalid">
            Save
          </button>
        </div>
      </form>
    </mat-card>

  <!-- List all users -->
  <table mat-table [dataSource]="users" class="mat-elevation-z8">
    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef>First Name</th>
      <td mat-cell *matCellDef="let user">
        <span *ngIf="!(editingUserId === user.id && editingField === 'firstName')" (click)="startEdit(user.id, 'firstName')">
          {{ user.firstName }}
        </span>
        <input *ngIf="editingUserId === user.id && editingField === 'firstName'"
               [value]="user.firstName"
               (blur)="saveEdit(user, 'firstName', $event)" />
      </td>
    </ng-container>

    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef>Last Name</th>
      <td mat-cell *matCellDef="let user">
        <span *ngIf="!(editingUserId === user.id && editingField === 'lastName')" (click)="startEdit(user.id, 'lastName')">
          {{ user.lastName }}
        </span>
        <input *ngIf="editingUserId === user.id && editingField === 'lastName'"
               [value]="user.lastName"
               (blur)="saveEdit(user, 'lastName', $event)" />
      </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">
        <span *ngIf="!(editingUserId === user.id && editingField === 'email')" (click)="startEdit(user.id, 'email')">
          {{ user.email }}
        </span>
        <input *ngIf="editingUserId === user.id && editingField === 'email'"
               [value]="user.email"
               type="email"
               (blur)="saveEdit(user, 'email', $event)" />
      </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let user">
        <!-- if Owner or SuperAdmin, just show, no edit -->
         <span *ngIf="user.role === 'Owner' || user.role === 'SuperAdmin'"
              matTooltip="This role cannot be changed."
              matTooltipPosition="above">
          {{ user.role }}
        </span>
        <!-- if not Owner or SuperAdmin, allow edit -->
        <ng-container *ngIf="!(user.role === 'Owner' || user.role === 'SuperAdmin')">
          <span *ngIf="!(editingUserId === user.id && editingField === 'role')" (click)="startEdit(user.id, 'role')">
            {{ user.role }}
          </span>
          <select *ngIf="editingUserId === user.id && editingField === 'role'"
                  (blur)="saveEdit(user, 'role', $event)">
            <option *ngFor="let role of roles" [value]="role" [selected]="role === user.role">{{ role }}</option>
          </select>
        </ng-container>
      </td>
    </ng-container>

    <ng-container matColumnDef="ageCategoryId">
      <th mat-header-cell *matHeaderCellDef>Age Category</th>
      <td mat-cell *matCellDef="let user">
        <span *ngIf="!(editingUserId === user.id && editingField === 'ageCategoryId')" (click)="startEdit(user.id, 'ageCategoryId')">
          {{ user.ageCategoryName || 'Unknown' }}
        </span>
        <select *ngIf="editingUserId === user.id && editingField === 'ageCategoryId'"
                (blur)="saveEdit(user, 'ageCategoryId', $event)">
          <option *ngFor="let category of ageCategories" [value]="category.id" [selected]="category.id === user.ageCategoryId">
            {{ category.name }}
          </option>
        </select>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let user">
         <span
          [matTooltip]="user.id === currentUserId 
                  ? 'You cannot deactivate yourself'
                  : 'You cannot deactivate the Owner'"
          [matTooltipDisabled]="!(user.id === currentUserId || user.role === 'Owner' || user.role === 'SuperAdmin')"
          matTooltipPosition="above">

          <button mat-button 
                  (click)="toggleUserStatus(user)" 
                  [disabled]="user.id === currentUserId || user.role === 'Owner' || user.role === 'SuperAdmin'">
            {{ user.isActive ? 'Deactivate' : 'Reactivate' }}
          </button>
          <button mat-button class="warn-btn" 
            *ngIf="!user.isActive"
            (click)="deleteUser(user)" 
            [disabled]="user.id === currentUserId || user.role === 'Owner' || user.role === 'SuperAdmin'">Delete</button>
        </span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['firstName', 'lastName', 'email', 'role', 'ageCategoryId', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['firstName', 'lastName', 'email', 'role', 'ageCategoryId', 'actions'];"></tr>
  </table>
</div>
