<div class="container mt-4">
  <h2>Users</h2>

  <button mat-button id="add-user" (click)="addUser()">
    <mat-icon>add</mat-icon> Add User
  </button>

  <table mat-table [dataSource]="users" class="mat-elevation-z8">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user">
        {{ user.fname }} {{ user.lname }}
      </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">
        {{ user.email }}
      </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let user">
        {{ user.role }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let user">
        <button mat-icon-button id="edit-button" (click)="startEdit(user)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button id="delete-button" (click)="deleteUser(user.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['name', 'email', 'role', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['name', 'email', 'role', 'actions'];"></tr>
  </table>

  <div *ngIf="addingUser" class="create-form">
    <h3>Add New User</h3>
    <form [formGroup]="createForm">
      <mat-form-field>
        <mat-label>First Name</mat-label>
        <input matInput formControlName="fname" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="lname" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Role</mat-label>
        <input matInput formControlName="role" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Age Category ID</mat-label>
        <input matInput formControlName="ageCategoryId" type="number" />
      </mat-form-field>

      <div class="button-group">
        <button mat-raised-button id="save-button" (click)="saveCreate()">Save</button>
        <button mat-button id="cancel-button" (click)="cancelCreate()">Cancel</button>
      </div>
    </form>
  </div>

  <div *ngIf="editingUser" class="edit-form">
    <h3>Edit User</h3>
    <form [formGroup]="editForm">
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" />
      </mat-form-field>

      <div class="button-group">
        <button mat-raised-button id="save-update-button" (click)="saveEdit()">Save</button>
        <button mat-button id="cancel-edit-button" (click)="cancelEdit()">Cancel</button>
      </div>
    </form>
  </div>
</div>
