<h2>Select Google Drive Folder</h2>

<p>
  Choose the folder that contains your EPUB and PDF files.  
  Only files inside this folder and its subfolders will be available for import.
</p>

<div class="actions">
  <button mat-button color="primary" (click)="openGooglePicker()">Select Folder</button>
  <button mat-button (click)="close()">Cancel</button>
</div>
