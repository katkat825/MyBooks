<div class="container mt-4">
  <h2>Google Drive</h2>

  <button mat-button (click)="connect()">
    <mat-icon>cloud</mat-icon> Connect Google Drive
  </button>

  <table mat-table [dataSource]="integrations" multiTemplateDataRows class="mat-elevation-z8 mt-3">
    <ng-container matColumnDef="accountEmail">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let integration">{{ integration.accountEmail }}</td>
    </ng-container>

    <ng-container matColumnDef="createdDate">
      <th mat-header-cell *matHeaderCellDef>Created</th>
      <td mat-cell *matCellDef="let integration">
        {{ integration.createdDate | date:'mediumDate' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="folders">
      <th mat-header-cell *matHeaderCellDef>Folders</th>
      <td mat-cell *matCellDef="let integration">
        <div *ngIf="integration.folders?.length > 0; else noFolders">
          <div *ngFor="let folder of integration.folders" class="folder-row">
            <mat-icon>folder</mat-icon>
            <span class="folder-name">{{ folder.name }}</span>
          </div>
        </div>
        <ng-template #noFolders>
          <span>No folders connected</span>
        </ng-template>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let integration">
        <div class="actions-column">
          <button mat-button (click)="openFolderDialog(integration)">Manage</button>
          <button mat-button class="warn-btn" (click)="remove(integration)">Remove</button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['accountEmail','createdDate','folders','actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['accountEmail','createdDate','folders','actions'];"></tr>
  </table>
</div>
