<h2 >Bulk Import Jobs</h2>
<mat-dialog-content>
  <table mat-table [dataSource]="jobs" class="mat-elevation-z8 w-100 import-status-table" *ngIf="jobs.length > 0">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let job">{{ job.id }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let job">{{ job.status }}</td>
    </ng-container>

    <ng-container matColumnDef="createdDate">
      <th mat-header-cell *matHeaderCellDef>Created</th>
      <td mat-cell *matCellDef="let job">{{ job.createdDate + 'Z' | date: 'short' }}</td>
    </ng-container>

    <ng-container matColumnDef="completedDate">
      <th mat-header-cell *matHeaderCellDef>Completed</th>
      <td mat-cell *matCellDef="let job">{{ job.completedDate + 'Z' | date: 'short' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['id','status','createdDate','completedDate']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['id','status','createdDate','completedDate'];"></tr>
  </table>

  <div *ngIf="jobs.length === 0">
    <p>No jobs found.</p>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close()">Close</button>
</mat-dialog-actions>
