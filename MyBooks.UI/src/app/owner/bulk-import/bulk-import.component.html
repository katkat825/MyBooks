<div class="container mt-4" [formGroup]="form">
  <h2>Bulk Import</h2>

  <!-- integration selection -->
  <mat-form-field appearance="fill" class="w-100 mb-3">
    <mat-label>Select Integration</mat-label>
    <mat-select formControlName="integrationId" (selectionChange)="onIntegrationSelected($event.value)">
      <mat-option *ngFor="let integration of integrations" [value]="integration.id">
        {{ integration.accountEmail }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- folder selection -->
  <mat-form-field appearance="fill" class="w-100 mb-3" *ngIf="folders.length > 0">
    <mat-label>Select Folder</mat-label>
    <mat-select formControlName="folderId" (selectionChange)="onFolderSelected($event.value)">
      <mat-option *ngFor="let folder of folders" [value]="folder.id">
        {{ folder.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- primary genre + age category -->
  <div class="row mb-3" *ngIf="files.length > 0">
    <div class="col">
      <mat-form-field appearance="fill" class="w-100">
        <mat-label>Primary Genre</mat-label>
        <mat-select formControlName="genreId" required>
          <mat-option *ngFor="let g of genres" [value]="g.id">{{ g.name }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col">
      <mat-form-field appearance="fill" class="w-100">
        <mat-label>Primary Age Category</mat-label>
        <mat-select formControlName="ageCategoryId" required>
          <mat-option *ngFor="let a of ageCategories" [value]="a.id">{{ a.name }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <!-- submit button -->
  <button mat-raised-button color="primary" class="mb-3"
          [disabled]="form.invalid || noFilesSelected"
          (click)="submit()">
    Start Import
  </button>

  <!-- file list -->
  <table mat-table [dataSource]="files" class="mat-elevation-z8 w-100" *ngIf="files.length > 0">
    <!-- select checkbox -->
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let file">
        <mat-checkbox [(ngModel)]="file.selected" [ngModelOptions]="{standalone: true}"></mat-checkbox>
      </td>
    </ng-container>

    <!-- file name -->
    <ng-container matColumnDef="fileName">
      <th mat-header-cell *matHeaderCellDef>File</th>
      <td mat-cell *matCellDef="let file">{{ file.name }}</td>
    </ng-container>

    <!-- override genre -->
    <ng-container matColumnDef="overrideGenreId">
      <th mat-header-cell *matHeaderCellDef>Override Genre</th>
      <td mat-cell *matCellDef="let file">
        <mat-form-field appearance="fill" class="w-100">
          <mat-select [(ngModel)]="file.overrideGenreId" [ngModelOptions]="{standalone: true}">
            <mat-option [value]="null">Use Primary</mat-option>
            <mat-option *ngFor="let g of genres" [value]="g.id">{{ g.name }}</mat-option>
          </mat-select>
        </mat-form-field>
      </td>
    </ng-container>

    <!-- override age category -->
    <ng-container matColumnDef="overrideAgeCategoryId">
      <th mat-header-cell *matHeaderCellDef>Override Age Category</th>
      <td mat-cell *matCellDef="let file">
        <mat-form-field appearance="fill" class="w-100">
          <mat-select [(ngModel)]="file.overrideAgeCategoryId" [ngModelOptions]="{standalone: true}">
            <mat-option [value]="null">Use Primary</mat-option>
            <mat-option *ngFor="let a of ageCategories" [value]="a.id">{{ a.name }}</mat-option>
          </mat-select>
        </mat-form-field>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['select','fileName','overrideGenreId','overrideAgeCategoryId']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['select','fileName','overrideGenreId','overrideAgeCategoryId'];"></tr>
  </table>
</div>
