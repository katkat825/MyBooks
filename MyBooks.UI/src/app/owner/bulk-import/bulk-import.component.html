<div class="owner-container container mt-4" [formGroup]="form">
  <h2>Bulk Import</h2>

  <!-- top action buttons -->
  <div class="action-buttons mb-3">
    <button mat-button id="view-jobs" (click)="openJobsDialog()">
      <mat-icon aria-hidden="true">list_alt</mat-icon>
      View Jobs
    </button>

    <button
      mat-button
      id="open-picker"
      (click)="openGooglePicker()"
      [disabled]="!selectedIntegrationId"
    >
      <mat-icon>sync_alt</mat-icon>
      Select Files
    </button>

    <button
      mat-button
      id="start-bulk-import"
      [disabled]="form.invalid || newFiles.length === 0"
      (click)="submit()"
    >
      <mat-icon>cloud_download</mat-icon>
      Start Import
    </button>
  </div>

  <!-- select integration -->
  <mat-form-field
    appearance="outline"
    class="integration-select"
  >
    <mat-label>Select Drive</mat-label>
    <mat-select
      [value]="selectedIntegrationId"
      (selectionChange)="onIntegrationSelected($event.value)"
    >
      <mat-option
        *ngFor="let integration of integrations"
        [value]="integration.id"
      >
        {{ integration.accountEmail }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- files table -->
  <div class="owner-container" *ngIf="files.length > 0">
    <table mat-table [dataSource]="files" class="mat-elevation-z8 w-100">
      <!-- file name -->
      <ng-container matColumnDef="fileName">
        <th mat-header-cell *matHeaderCellDef>File Name</th>
        <td 
          mat-cell
          *matCellDef="let file"
          [class.already-imported]="file.skipFile"
        >
          <mat-icon
            id="already-imported"
            *ngIf="file.skipFile"
            matTooltip="Already imported - will be skipped"
            aria-label="File previously imported and will be skipped"
          >done_all</mat-icon>
          <mat-icon
            id="importable-file"
            *ngIf="!file.skipFile"
            aria-hidden="true"
          ></mat-icon>
          {{ file.name }}</td>
      </ng-container>

      <!-- genre -->
      <ng-container matColumnDef="overrideGenreId">
        <th mat-header-cell *matHeaderCellDef>
          <mat-select
            id="global-genre-select"
            [(ngModel)]="globalGenreId"
            (selectionChange)="applyGlobalGenre()"
            [ngModelOptions]="{ standalone: true }"
          >
            <mat-select-trigger>Genre</mat-select-trigger>
            <mat-option 
              *ngFor="let g of genres" 
              [value]="g.id"
            >
              {{ g.name }}
            </mat-option>
          </mat-select>
        </th>
        <td mat-cell *matCellDef="let file">
          <mat-select
            [(ngModel)]="file.overrideGenreId"
            [ngModelOptions]="{ standalone: true }"
            *ngIf="!file.skipFile"
          >
            <mat-option 
              *ngFor="let g of genres" 
              [value]="g.id"
            >
              {{ g.name }}
            </mat-option>
          </mat-select>
        </td>
      </ng-container>

      <!-- age category -->
      <ng-container matColumnDef="overrideAgeCategoryId">
        <th mat-header-cell *matHeaderCellDef>
          <mat-select
            [(ngModel)]="globalAgeCategoryId"
            (selectionChange)="applyGlobalAge()"
            [ngModelOptions]="{ standalone: true }"
          >
            <mat-select-trigger>Age Category</mat-select-trigger>
            <mat-option *ngFor="let a of ageCategories" [value]="a.id">
              {{ a.name }}
            </mat-option>
          </mat-select>
        </th>
        <td mat-cell *matCellDef="let file">
          <mat-select
            [(ngModel)]="file.overrideAgeCategoryId"
            [ngModelOptions]="{ standalone: true }"
            *ngIf="!file.skipFile"
          >
            <mat-option 
              *ngFor="let a of ageCategories" 
              [value]="a.id"
            >
              {{ a.name }}
            </mat-option>
          </mat-select>
        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="['fileName', 'overrideGenreId', 'overrideAgeCategoryId']"
      ></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: ['fileName', 'overrideGenreId', 'overrideAgeCategoryId']"
      ></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="3">
          No EPUB or PDF files selected for import.
        </td>
      </tr>
    </table>
  </div>

  <mat-divider class="my-3"></mat-divider>

  <div class="info-row">
    <mat-icon class="me-1">info</mat-icon>
    Only EPUB and PDF files are supported at this time.
  </div>
</div>
