<div class="owner-container">
    <table mat-table [dataSource]="files" class="mat-elevation-z8 w-100">
        <!-- select checkbox -->
        <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox
                [checked]="isAllSelected()"
                [indeterminate]="isIndeterminate()"
                (change)="toggleAllSelection($event)">
            </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let file">
            <mat-checkbox [(ngModel)]="file.selected" [ngModelOptions]="{standalone: true}"></mat-checkbox>
            </td>
        </ng-container>

        <!-- file name -->
        <ng-container matColumnDef="fileName">
            <th mat-header-cell *matHeaderCellDef class="file-name-cell">File Name</th>
            <td mat-cell *matCellDef="let file"
                (click)="toggleFileSelection(file)"
                class="clickable-name file-name-cell">
            {{ file.name }}
            </td>
        </ng-container>

        <!-- genre (header has global dropdown) -->
        <ng-container matColumnDef="overrideGenreId">
            <th mat-header-cell *matHeaderCellDef class="override-dropdown bulk-th-dropdown">
                <mat-select [(ngModel)]="globalGenreId" (selectionChange)="applyGlobalGenre()">
                    <mat-select-trigger>Genre</mat-select-trigger>
                <mat-option *ngFor="let g of genres" [value]="g.id">{{ g.name }}</mat-option>
                </mat-select>
            </th>
            <td mat-cell *matCellDef="let file" class="override-dropdown">
                <mat-select [(ngModel)]="file.overrideGenreId" [ngModelOptions]="{standalone: true}">
                <mat-option *ngFor="let g of genres" [value]="g.id">{{ g.name }}</mat-option>
                </mat-select>
            </td>
        </ng-container>

        <!-- age category (header has global dropdown) -->
        <ng-container matColumnDef="overrideAgeCategoryId">
            <th mat-header-cell *matHeaderCellDef class="override-dropdown bulk-th-dropdown">
                <mat-select [(ngModel)]="globalAgeCategoryId" (selectionChange)="applyGlobalAge()">
                    <mat-select-trigger>
                        <span class="hide-mobile">Age Category</span>
                        <span class="show-mobile">Age</span>
                    </mat-select-trigger>
                    <mat-option *ngFor="let a of ageCategories" [value]="a.id">{{ a.name }}</mat-option>
                </mat-select>
            </th>
            <td mat-cell *matCellDef="let file" class="override-dropdown">
                <mat-select [(ngModel)]="file.overrideAgeCategoryId" [ngModelOptions]="{standalone: true}">
                    <mat-option *ngFor="let a of ageCategories" [value]="a.id">{{ a.name }}</mat-option>
                </mat-select>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['select','fileName','overrideGenreId','overrideAgeCategoryId']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['select','fileName','overrideGenreId','overrideAgeCategoryId']"></tr>

        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="4">No new EPUB or PDF files found in the selected folder.</td>
        </tr>
    </table>
</div>
